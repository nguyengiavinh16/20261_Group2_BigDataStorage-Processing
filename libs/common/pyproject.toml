[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoguard-common"
version = "0.1.0"
description = "Shared utilities for CryptoGuard: config, time, contracts, reference data, feature definitions"
requires-python = ">=3.10"  # Spark/Flink images ship Python 3.10
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.21",
]

[tool.setuptools.packages.find]
where = ["src"]
