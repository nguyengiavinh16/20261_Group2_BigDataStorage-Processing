# Shared defaults. Profile files (local.yaml / cloud.yaml) override these; env vars CG_<SECTION>__<KEY> override both.
# Loaded by cryptoguard_common.config.load_config(). Keys are part of the team contract: add freely, rename via PR.

project: cryptoguard

kafka:
  bootstrap_servers: localhost:32100      # in-cluster: cg-kafka-kafka-bootstrap.cg-kafka:9092
  topic_registry: contracts/kafka-topics.yaml
  producer:
    acks: all
    enable_idempotence: true
    linger_ms: 20
    compression_type: lz4

storage:                                  # S3-compatible API (MinIO locally, GCS interoperability in cloud)
  endpoint: http://localhost:30900
  region: us-east-1
  bucket: cg-lake
  bronze_prefix: bronze
  warehouse_prefix: warehouse             # Iceberg tables (silver/gold)
  path_style: true

iceberg:
  catalog_name: cg
  catalog_type: jdbc                      # ADR-0005
  jdbc_db: iceberg_catalog
  namespaces: [silver, gold]

postgres:
  host: localhost
  port: 30432
  user: cg

mongo:
  uri: mongodb://localhost:30017
  db: cryptoguard

redis:
  url: redis://localhost:30379/0

mlflow:
  tracking_uri: http://localhost:30500
  experiment: cryptoguard-pump

exchanges:
  enabled: [binance, okx]                 # MVP: Binance + 1 more. P4 adds coinbase, kraken
  binance:
    ws_url: wss://stream.binance.com:9443/stream
    max_connection_hours: 23              # Binance drops connections at 24h; rotate before
  okx:
    ws_url: wss://ws.okx.com:8443/ws/v5/public
  coinbase:
    ws_url: wss://ws-feed.exchange.coinbase.com
  kraken:
    ws_url: wss://ws.kraken.com/v2

ethereum:
  ws_url: wss://ethereum-rpc.publicnode.com
  confirmations: 12
  tracked_tokens: [USDT, USDC, WETH]      # resolved via contracts/reference/token_registry.csv

symbols:                                  # canonical BASE-QUOTE; mapped per exchange by contracts/reference/symbol_map.csv
  watchlist: [BTC-USDT, ETH-USDT]         # P0 (DET-01/BAT-01) adds small caps that appear in the pump dataset

detector:
  windows_seconds: [60, 300]
  watermark_seconds: 5
  allowed_lateness_seconds: 30
  baseline_days: 7
  case_merge_minutes: 30
  pump_rule:                              # starting points only, tuned on replay (MLS-06)
    version: pump-v1
    volume_z_min: 5.0
    price_change_pct_min: 15.0
    taker_buy_ratio_min: 0.75
    min_trades: 20
  dump_rule:                              # only evaluated while a pump case is open
    version: dump-v1
    price_change_pct_max: -10.0

replay:
  speed: 50.0                             # 1.0 = real time
  topic_prefix: replay.

data_budget:                              # guard rails for downloads
  max_days_history: 30
  max_symbols: 20
