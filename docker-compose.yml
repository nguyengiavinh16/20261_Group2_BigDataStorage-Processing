services:
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/artifacts/fraud_model.joblib
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: fraud_detection
      MONGODB_COLLECTION: predictions
      FRAUD_THRESHOLD: "0.5"
    depends_on: [mongodb]
    volumes: ["./artifacts:/app/artifacts"]
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
volumes:
  mongo_data:
