[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-system"
version = "0.2.0"
description = "Academic real-time financial fraud detection prototype using PaySim"
requires-python = ">=3.10,<3.12"
dependencies = [
  "pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2", "PyYAML>=6,<7", "pydantic>=2.6,<3",
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pymongo>=4.6,<5",
  "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.3,<1"]
streaming = ["kafka-python>=2.0,<3", "pyspark>=3.5,<4"]
batch = ["pyspark>=3.5,<4", "pyarrow>=15,<25"]
dashboard = ["streamlit>=1.32,<2", "plotly>=5.20,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
