# Local cluster: `make up` creates it. Single node keeps RAM usage low on laptops (16 GB min).
# NodePorts below are mapped to localhost so code running on the host (WSL2) reaches in-cluster services.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cryptoguard
nodes:
  - role: control-plane
    labels:
      cg/pool: general
    extraPortMappings:
      - {containerPort: 32100, hostPort: 32100}   # Kafka bootstrap (external listener)
      - {containerPort: 32000, hostPort: 32000}   # Kafka broker 0 (external listener)
      - {containerPort: 30900, hostPort: 30900}   # MinIO S3 API
      - {containerPort: 30901, hostPort: 30901}   # MinIO console
      - {containerPort: 30432, hostPort: 30432}   # Postgres
      - {containerPort: 30017, hostPort: 30017}   # MongoDB
      - {containerPort: 30379, hostPort: 30379}   # Redis
      - {containerPort: 30500, hostPort: 30500}   # MLflow
      - {containerPort: 30300, hostPort: 30300}   # Grafana
      - {containerPort: 30808, hostPort: 30808}   # Airflow web
      - {containerPort: 30800, hostPort: 30800}   # CryptoGuard API (when deployed in-cluster)
