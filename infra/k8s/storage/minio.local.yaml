# Local S3-compatible object storage (data lake: bronze/ + warehouse/). Cloud replaces it with GCS (ADR-0002).
# VERIFY (INF-05): MinIO changed its community distribution in 2025; this pins an existing image tag.
# If the image cannot be pulled, switch to another S3-compatible server (e.g. SeaweedFS/Garage); code is unaffected
# because everything talks plain S3 API through config `storage.*`.
apiVersion: v1
kind: Secret
metadata: {name: cg-minio, namespace: cg-storage}
type: Opaque
stringData:
  MINIO_ROOT_USER: cgadmin
  MINIO_ROOT_PASSWORD: cgadmin-change-me   # local only
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: cg-minio-data, namespace: cg-storage}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 40Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cg-minio, namespace: cg-storage, labels: {app: cg-minio, app.kubernetes.io/part-of: cryptoguard}}
spec:
  replicas: 1
  selector: {matchLabels: {app: cg-minio}}
  template:
    metadata: {labels: {app: cg-minio, app.kubernetes.io/part-of: cryptoguard}}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom: [{secretRef: {name: cg-minio}}]
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}, periodSeconds: 10}
          resources: {requests: {memory: 256Mi, cpu: 100m}, limits: {memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: cg-minio-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: cg-minio, namespace: cg-storage}
spec:
  type: NodePort
  selector: {app: cg-minio}
  ports:
    - {name: s3, port: 9000, targetPort: 9000, nodePort: 30900}
    - {name: console, port: 9001, targetPort: 9001, nodePort: 30901}
---
# Creates the lake bucket once MinIO is ready (idempotent).
apiVersion: batch/v1
kind: Job
metadata: {name: cg-minio-init, namespace: cg-storage}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: amazon/aws-cli:latest
          envFrom: [{secretRef: {name: cg-minio}}]
          command: ["/bin/sh", "-c"]
          args:
            - >
              export AWS_ACCESS_KEY_ID=$MINIO_ROOT_USER AWS_SECRET_ACCESS_KEY=$MINIO_ROOT_PASSWORD AWS_DEFAULT_REGION=us-east-1;
              aws --endpoint-url http://cg-minio:9000 s3 ls s3://cg-lake ||
              aws --endpoint-url http://cg-minio:9000 s3 mb s3://cg-lake
