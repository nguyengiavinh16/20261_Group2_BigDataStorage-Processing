# MongoDB for alerts, cases, recent features, wallet_risk (collections/indexes owned by R5, see serving/README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: cg-mongo-data, namespace: cg-serving}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cg-mongo, namespace: cg-serving, labels: {app: cg-mongo, app.kubernetes.io/part-of: cryptoguard}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: cg-mongo}}
  template:
    metadata: {labels: {app: cg-mongo, app.kubernetes.io/part-of: cryptoguard}}
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports: [{containerPort: 27017}]
          resources: {requests: {memory: 256Mi, cpu: 100m}, limits: {memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /data/db}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: cg-mongo-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: cg-mongo, namespace: cg-serving}
spec:
  type: NodePort
  selector: {app: cg-mongo}
  ports: [{port: 27017, targetPort: 27017, nodePort: 30017}]
