# Redis: online lookups for the detector (wallet_risk:<addr>, baseline:<symbol>:<exchange>:<hour>).
apiVersion: apps/v1
kind: Deployment
metadata: {name: cg-redis, namespace: cg-serving, labels: {app: cg-redis, app.kubernetes.io/part-of: cryptoguard}}
spec:
  replicas: 1
  selector: {matchLabels: {app: cg-redis}}
  template:
    metadata: {labels: {app: cg-redis, app.kubernetes.io/part-of: cryptoguard}}
    spec:
      containers:
        - name: redis
          image: redis:7.2
          args: ["--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379}]
          resources: {requests: {memory: 128Mi, cpu: 50m}, limits: {memory: 384Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: cg-redis, namespace: cg-serving}
spec:
  type: NodePort
  selector: {app: cg-redis}
  ports: [{port: 6379, targetPort: 6379, nodePort: 30379}]
