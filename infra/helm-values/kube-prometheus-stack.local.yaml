# Light monitoring for laptops. Grafana: http://localhost:30300 (admin / cg-admin, local only).
alertmanager:
  enabled: false
grafana:
  adminPassword: cg-admin
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests: {memory: 128Mi, cpu: 50m}
prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up ServiceMonitors/PodMonitors from every namespace (components label theirs with part-of=cryptoguard).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {memory: 512Mi, cpu: 100m}
      limits: {memory: 1536Mi}
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
